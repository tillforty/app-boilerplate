name: tillforty-app

services:
  # ── Postgres (with pgvector + pgcrypto) ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot SQL migrations (run in numeric order, then exit) ────────────
  migrate:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Running migrations in order against $$DATABASE_URL"
        for f in /migrations/0*.sql; do
          echo "→ applying $$f"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "Migrations complete."

  # ── FastAPI backend ──────────────────────────────────────────────────────
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/srv/storage
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── React frontend (nginx serving the built SPA + /api proxy) ────────────
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # ── n8n Postgres (separate DB for n8n) ──────────────────────────────────
  # n8n requires its own database — never share with the app DB.
  n8n_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["n8n"]
    environment:
      POSTGRES_USER: ${N8N_POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${N8N_POSTGRES_DB:-n8n}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${N8N_POSTGRES_USER:-n8n} -d $${N8N_POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── n8n workflow automation ───────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    profiles: ["n8n"]
    depends_on:
      n8n_postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-CHANGE_ME}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-CHANGE_ME}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"

  # ── Caddy reverse proxy (public HTTPS) — OPTIONAL ────────────────────────
  # Only runs when the `public` profile is active (start.sh enables it when
  # DOMAIN is set in .env). Terminates TLS with an automatic Let's Encrypt
  # certificate for ${DOMAIN} and proxies everything to the web (nginx) service,
  # which already serves the SPA and proxies /api to the backend.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["public"]
    env_file: .env
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # ACME certs + account keys (must persist)
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  n8n_pgdata:
  n8n_data:
  caddy_data:
  caddy_config:
