# Project name prefixes every container, network and volume. Override per client
# install in .env — but only on a FRESH install: changing it later orphans the
# existing volumes (Postgres data included) under the old prefix.
name: ${COMPOSE_PROJECT_NAME:-tillforty-app}

# Shared config for every GlitchTip container (web/worker/migrate). Defined as a
# top-level extension field (x-*, ignored by Compose) so the three services can
# reference it via the *glitchtip-env anchor and stay in lockstep.
x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://${GLITCHTIP_POSTGRES_USER:-glitchtip}:${GLITCHTIP_POSTGRES_PASSWORD:-CHANGE_ME}@glitchtip_postgres:5432/${GLITCHTIP_POSTGRES_DB:-glitchtip}
  REDIS_URL: redis://glitchtip_redis:6379/0
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-CHANGE_ME}
  PORT: 8080
  # Public URL where the GlitchTip UI is reachable (used in emails + DSN host).
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8090}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
  # Open registration lets you create the first admin. Set false once you have
  # your account, so the instance can't be signed up to by strangers.
  ENABLE_OPEN_USER_REGISTRATION: ${GLITCHTIP_ENABLE_OPEN_USER_REGISTRATION:-true}
  CELERY_WORKER_AUTOSCALE: "1,2"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"

services:
  # ── Postgres (with pgvector + pgcrypto) ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot SQL migrations (run in filename order, then exit) ───────────
  migrate:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        # Byte order, not locale order, so every host applies the same sequence.
        export LC_ALL=C
        # Two lineages adding a migration on the same number is the classic fork
        # hazard: both files apply, in an order nobody chose. Refuse to guess.
        dupes="$$(basename -a /migrations/*.sql | cut -d_ -f1 | sort | uniq -d)"
        if [ -n "$$dupes" ]; then
          echo "Duplicate migration prefixes — rename one side: $$dupes" >&2
          exit 1
        fi
        echo "Running migrations in order against $$DATABASE_URL"
        for f in /migrations/*.sql; do
          echo "→ applying $$f"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "Migrations complete."

  # ── FastAPI backend ──────────────────────────────────────────────────────
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/srv/storage
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Development agent runner (opt-in: AGENT_ENABLED=true) ────────────────
  # Executes Development › Agent jobs: clones the configured GitHub repo, runs
  # Claude Code or Codex in auto mode, pushes a branch, opens the PR, and — on
  # Deploy — merges it and rebuilds this stack. Deliberately separate from the
  # api container, which has no git, no Node, and no Docker access.
  agent_runner:
    build: ./agent-runner
    # Pinned name so the runner can launch a deploy sibling from this same image.
    # Give each client install its own tag, or two stacks on one host fight over
    # which build the tag points at.
    image: ${AGENT_RUNNER_IMAGE:-tillforty-agent-runner:local}
    restart: unless-stopped
    profiles: ["agent"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      AGENT_RUNNER_IMAGE: ${AGENT_RUNNER_IMAGE:-tillforty-agent-runner:local}
    volumes:
      - agent_work:/work
      # Lets the runner drive the HOST daemon to rebuild the stack on Deploy.
      # This is root-equivalent access to the host — keep AGENT_ENABLED=false
      # unless you want one-click deploys.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the SAME path inside and out, so the relative bind mounts in
      # this file still resolve when the rebuild is driven from inside.
      - ${APP_CHECKOUT_PATH:-/opt/app-boilerplate}:${APP_CHECKOUT_PATH:-/opt/app-boilerplate}

  # ── React frontend (nginx serving the built SPA + /api proxy) ────────────
  web:
    build:
      context: ./web
      # VITE_* values are baked into the static bundle at BUILD time (the SPA has
      # no server runtime), so the browser-side Sentry DSN must be passed as a
      # build arg. Changing SENTRY_DSN therefore requires a `web` image rebuild.
      # Blank by default → the frontend SDK no-ops (see web/src/lib/observability.ts).
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # ── n8n Postgres (separate DB for n8n) ──────────────────────────────────
  # n8n requires its own database — never share with the app DB.
  n8n_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["n8n"]
    environment:
      POSTGRES_USER: ${N8N_POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${N8N_POSTGRES_DB:-n8n}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${N8N_POSTGRES_USER:-n8n} -d $${N8N_POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── n8n workflow automation ───────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    profiles: ["n8n"]
    depends_on:
      n8n_postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-CHANGE_ME}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-CHANGE_ME}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"

  # ── GlitchTip: self-hosted, Sentry-compatible error monitoring — OPTIONAL ─
  # Only runs under the `glitchtip` profile (start.sh enables it when
  # GLITCHTIP_ENABLED=true). Speaks the Sentry DSN + REST API, so the app's
  # Sentry SDKs (backend/app/observability.py, web/src/lib/observability.ts)
  # point straight at it. Own Postgres + Redis — never share the app DB.
  # Footprint is ~1GB; leave disabled on small boxes.
  glitchtip_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["glitchtip"]
    environment:
      POSTGRES_USER: ${GLITCHTIP_POSTGRES_USER:-glitchtip}
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${GLITCHTIP_POSTGRES_DB:-glitchtip}
    volumes:
      - glitchtip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${GLITCHTIP_POSTGRES_USER:-glitchtip} -d $${GLITCHTIP_POSTGRES_DB:-glitchtip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip_redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["glitchtip"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply GlitchTip's DB schema, then exit (like the app `migrate`).
  glitchtip_migrate:
    image: glitchtip/glitchtip:v4.1
    restart: "no"
    profiles: ["glitchtip"]
    command: ["./manage.py", "migrate"]
    environment: *glitchtip-env
    depends_on:
      glitchtip_postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:v4.1
    restart: unless-stopped
    profiles: ["glitchtip"]
    environment: *glitchtip-env
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_redis:
        condition: service_healthy
      glitchtip_migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads
    ports:
      - "${GLITCHTIP_PORT:-8090}:8080"

  glitchtip_worker:
    image: glitchtip/glitchtip:v4.1
    restart: unless-stopped
    profiles: ["glitchtip"]
    command: ["./bin/run-celery-with-beat.sh"]
    environment: *glitchtip-env
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_redis:
        condition: service_healthy
      glitchtip_migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads

  # ── Caddy reverse proxy (public HTTPS) — OPTIONAL ────────────────────────
  # Only runs when the `public` profile is active (start.sh enables it when
  # DOMAIN is set in .env). Terminates TLS with an automatic Let's Encrypt
  # certificate for ${DOMAIN} and proxies everything to the web (nginx) service,
  # which already serves the SPA and proxies /api to the backend.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["public"]
    env_file: .env
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      # GlitchTip over TLS on the same hostname — see the Caddyfile block.
      - "${GLITCHTIP_TLS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # ACME certs + account keys (must persist)
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  agent_work:
  n8n_pgdata:
  n8n_data:
  glitchtip_pgdata:
  glitchtip_uploads:
  caddy_data:
  caddy_config:
