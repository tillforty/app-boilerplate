server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: strip the /api prefix and forward to the backend. The backend runs
    # with --root-path /api, so its routes live at the root (/auth, /roles, ...)
    # and its docs at /docs reference /api/openapi.json — both work through here.
    location /api/ {
        # Uploads (documents, agent-job screenshots) would hit nginx's 1 MB
        # default long before the API's own limits — keep this at or above
        # MAX_UPLOAD_BYTES and AGENT_ATTACHMENT_TOTAL_BYTES.
        client_max_body_size 32m;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (vite emits content-hashed filenames) never change —
    # cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    # Non-hashed files (index.html, /logo.svg, favicon…) must revalidate so a
    # redeploy is picked up immediately instead of serving a stale cached copy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
