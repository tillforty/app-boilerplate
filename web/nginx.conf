server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: strip the /api prefix and forward to the backend. The backend runs
    # with --root-path /api, so its routes live at the root (/auth, /roles, ...)
    # and its docs at /docs reference /api/openapi.json — both work through here.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
